name: Release

# Builds this fork's own release: the quality gates, seven target binaries,
# .deb and .rpm packages, and a GitHub Release on the tag.
#
# Upstream also publishes to the AUR and to its Homebrew tap. Those two jobs are
# deliberately absent here. Both hard-code `github.com/termide/termide` as the
# artifact source and push into `termide`-owned remotes — aur.archlinux.org
# `termide` / `termide-bin` and `termide/homebrew-termide` — using deploy keys
# this fork does not hold. Restoring them means repointing every URL and secret
# at the fork's own ownership first; until then they would publish checksums of
# upstream's artifacts from a repository that is not upstream's.

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Quality checks before building
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check

      - name: Run clippy (strict mode)
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Install cargo-deny
        # Rust-cache lets us skip rebuilding cargo-deny on every run;
        # `--locked` keeps the version reproducible.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Supply-chain audit (cargo-deny)
        run: cargo deny check

  # Cross-platform builds
  build:
    name: Build ${{ matrix.target }}
    needs: quality-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (also works in WSL)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04  # Use older Ubuntu for glibc compatibility
            archive: tar.gz
          # Linux x86_64 (musl, fully static — runs on Alpine and any
          # other distro without a glibc dependency)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
            musl: true
          # Linux aarch64 (ARM servers, Raspberry Pi)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04  # Use older Ubuntu for glibc compatibility
            archive: tar.gz
            cross: true
          # Linux aarch64 (musl, fully static — runs under Termux on Android,
          # Alpine on ARM, and any glibc-free ARM64 system). Built via `cross`
          # so the musl toolchain + tree-sitter C deps link cleanly.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
            use_cross: true
          # macOS x86_64 (Intel Macs)
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # macOS Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Windows x86_64 (native)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools (Linux musl)
        if: matrix.musl
        # The musl C library + gcc wrapper. Rust's musl target links
        # statically by default, so no `target-feature=+crt-static`
        # flag is needed here; just the C toolchain to wrap any C deps.
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        # `cross` builds inside a target-matched container that ships the musl
        # cross toolchain, so the Rust code and the tree-sitter C deps link
        # against the same musl without hand-wiring a sysroot.
        run: cargo install cross --locked

      - name: Build
        # VFS uses rustls / russh — fully pure-Rust, no native OpenSSL —
        # so no extra features are required for static builds.
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/termide package/
          cp README.md LICENSE package/
          cp -r completions package/
          cd package
          tar czvf ../termide-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *
          cd ..

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item "target/${{ matrix.target }}/release/termide.exe" package/
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "termide-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termide-${{ matrix.target }}
          path: termide-${{ github.ref_name }}-${{ matrix.target }}.*

  # Build Debian packages
  build-deb:
    name: Build .deb packages
    needs: quality-checks
    runs-on: ubuntu-22.04  # Use older Ubuntu for glibc compatibility with Debian 12
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build and package
        run: cargo deb --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termide-deb-${{ matrix.target }}
          path: target/${{ matrix.target }}/debian/*.deb

  # Build RPM packages
  build-rpm:
    name: Build .rpm packages
    needs: quality-checks
    runs-on: ubuntu-22.04  # Use older Ubuntu for glibc compatibility
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate RPM
        run: cargo generate-rpm --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termide-rpm-${{ matrix.target }}
          path: target/${{ matrix.target }}/generate-rpm/*.rpm

  # Create GitHub Release with artifacts
  release:
    name: Create Release
    needs: [build, build-deb, build-rpm]
    runs-on: ubuntu-latest
    # Only create release when triggered by tag (not workflow_dispatch)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # Extract section for this version from CHANGELOG.md
          # Start from "## [VERSION]" line, end before next "## [" line
          BODY=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          # Write to file to preserve newlines
          echo "$BODY" > release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release_notes.md
          draft: false
          prerelease: false
